<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .chat-header {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-header h1 {
            color: #fff;
            font-size: 1.5rem;
        }

        .chat-header p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.85rem;
            margin-top: 5px;
        }

        .chat-messages {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .message.user {
            align-items: flex-end;
        }

        .message.bot {
            align-items: flex-start;
        }

        .message-content {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 18px;
            color: #fff;
            line-height: 1.4;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-bottom-right-radius: 5px;
        }

        .message.bot .message-content {
            background: rgba(255, 255, 255, 0.15);
            border-bottom-left-radius: 5px;
        }

        .chat-input {
            display: flex;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-input input {
            flex: 1;
            padding: 12px 18px;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        .chat-input input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .chat-input button {
            margin-left: 10px;
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .chat-input button:hover {
            transform: scale(1.05);
        }

        .mic-btn {
            margin-left: 10px;
            padding: 12px 15px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .mic-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .mic-btn.listening {
            background: #ff4757;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .status {
            text-align: center;
            padding: 10px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.8rem;
        }

        .error-msg {
            background: rgba(255, 71, 87, 0.2);
            color: #ff6b7a;
            padding: 10px;
            text-align: center;
            font-size: 0.85rem;
            display: none;
        }

        .mic-permission {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
            padding: 10px;
            text-align: center;
            font-size: 0.85rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🤖 AI Chat</h1>
            <p>Ask me anything!</p>
        </div>

        <div class="mic-permission" id="micPermission">
            🎤 Please allow microphone access when prompted
        </div>

        <div class="error-msg" id="errorMsg"></div>

        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                <div class="message-content">
                    Hello! I'm your AI assistant. How can I help you today?
                </div>
            </div>
        </div>

        <div class="status" id="status">Ready</div>

        <div class="chat-input">
            <input type="text" id="userInput" placeholder="Type your message..." autocomplete="off">
            <button class="mic-btn" id="micBtn" title="Click to speak">🎤</button>
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const micBtn = document.getElementById('micBtn');
        const statusEl = document.getElementById('status');
        const errorMsg = document.getElementById('errorMsg');
        const micPermission = document.getElementById('micPermission');

        // Check for speech recognition support
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            errorMsg.textContent = '❌ Speech recognition not supported in this browser. Please use Chrome or Edge.';
            errorMsg.style.display = 'block';
            micBtn.style.display = 'none';
        } else {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            let isListening = false;

            // Show permission hint
            micPermission.style.display = 'block';
            setTimeout(() => {
                micPermission.style.display = 'none';
            }, 5000);

            micBtn.addEventListener('click', () => {
                if (isListening) {
                    stopListening();
                } else {
                    startListening();
                }
            });

            function startListening() {
                try {
                    recognition.start();
                    isListening = true;
                    micBtn.classList.add('listening');
                    micBtn.textContent = '⏹️';
                    statusEl.textContent = '🎤 Listening... Speak now';
                    errorMsg.style.display = 'none';
                } catch (err) {
                    showError('Could not start microphone: ' + err.message);
                }
            }

            function stopListening() {
                recognition.stop();
                isListening = false;
                micBtn.classList.remove('listening');
                micBtn.textContent = '🎤';
                statusEl.textContent = 'Processing...';
            }

            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }

                userInput.value = transcript;

                if (event.results[event.results.length - 1].isFinal) {
                    stopListening();
                    if (transcript.trim()) {
                        sendMessage(transcript);
                    }
                }
            };

            recognition.onerror = (event) => {
                console.error('Speech error:', event.error);
                stopListening();

                switch(event.error) {
                    case 'not-allowed':
                        showError('❌ Microphone access denied. Please allow mic permissions in browser settings.');
                        break;
                    case 'no-speech':
                        showError('⚠️ No speech detected. Please try again.');
                        break;
                    case 'network':
                        showError('❌ Network error. Check your connection.');
                        break;
                    default:
                        showError('⚠️ Error: ' + event.error);
                }
            };

            recognition.onend = () => {
                if (isListening) {
                    stopListening();
                }
                statusEl.textContent = 'Ready';
            };
        }

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
            setTimeout(() => {
                errorMsg.style.display = 'none';
            }, 5000);
        }

        // Send message function
        function sendMessage(text = null) {
            const message = text || userInput.value.trim();
            if (!message) return;

            // Add user message
            addMessage(message, 'user');
            userInput.value = '';
            statusEl.textContent = 'Thinking...';

            // Simulate AI response
            setTimeout(() => {
                const response = getAIResponse(message);
                addMessage(response, 'bot');
                statusEl.textContent = 'Ready';
            }, 1000);
        }

        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            messageDiv.innerHTML = `<div class="message-content">${text}</div>`;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function getAIResponse(message) {
            const lower = message.toLowerCase();

            if (lower.includes('hello') || lower.includes('hi')) {
                return "Hello! How can I assist you today? 😊";
            } else if (lower.includes('how are you')) {
                return "I'm doing great, thank you for asking! How about you?";
            } else if (lower.includes('name')) {
                return "I'm your AI assistant! You can call me whatever you like.";
            } else if (lower.includes('weather')) {
                return "I'm not able to check the weather right now, but I hope it's nice where you are! ☀️";
            } else if (lower.includes('time')) {
                return `The current time is ${new Date().toLocaleTimeString()}.`;
            } else if (lower.includes('date')) {
                return `Today's date is ${new Date().toLocaleDateString()}.`;
            } else if (lower.includes('thank')) {
                return "You're welcome! Is there anything else I can help with?";
            } else if (lower.includes('bye')) {
                return "Goodbye! Have a great day! 👋";
            } else {
                return "That's interesting! Tell me more about that.";
            }
        }

        // Event listeners
        sendBtn.addEventListener('click', () => sendMessage());
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
