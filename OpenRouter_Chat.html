<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenRouter Chat</title>
<style>
  :root {
    --bg: #0d1117;
    --bg-card: #161b22;
    --bg-msg-user: #1c2128;
    --bg-msg-ass: #0e1117;
    --border: #30363d;
    --text: #c9d1d9;
    --accent: #58a6ff;
    --input-bg: #1f242d;
    --warning: #f0883e;
    --success: #3fb950;
  }
  [data-theme="light"] {
    --bg: #ffffff;
    --bg-card: #f6f8fa;
    --bg-msg-user: #dbeafe;
    --bg-msg-ass: #f1f3f4;
    --border: #d0d7de;
    --text: #24292f;
    --accent: #0969da;
    --input-bg: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    padding: .8rem 1rem;
    display: flex;
    align-items: center;
    gap: .8rem;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.1rem; flex-grow: 1; }
  select, input[type="password"], button {
    font-size: .85rem;
    padding: .4rem .6rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--input-bg);
    color: var(--text);
  }
  #themeToggle { background: var(--accent); color: #fff; border: none; cursor: pointer; }
  
  .status-bar {
    font-size: .8rem;
    padding: .4rem 1rem;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: .5rem;
    min-height: 2.2rem;
  }
  .status-bar.recording { background: rgba(255, 77, 77, 0.15); border-color: #ff4d4d; }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--border);
  }
  .status-dot.active { background: var(--success); animation: pulse-dot 1s infinite; }
  .status-dot.recording { background: #ff4d4d; animation: pulse-dot 0.5s infinite; }
  @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
  
  #chatContainer {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: .8rem;
  }
  .msg {
    max-width: 75%;
    padding: .7rem 1rem;
    border-radius: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
    animation: fadeIn .2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; } }
  .msg.user { align-self: flex-end; background: var(--bg-msg-user); border: 1px solid var(--border); }
  .msg.assistant { align-self: flex-start; background: var(--bg-msg-ass); border: 1px solid var(--border); }
  
  #inputArea { background: var(--bg-card); border-top: 1px solid var(--border); padding: .8rem 1rem; }
  #previewBar { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: .5rem; }
  .previewItem {
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: .3rem .5rem; display: flex; align-items: center; gap: .4rem; font-size: .8rem;
  }
  .previewItem img { max-height: 40px; border-radius: 4px; }
  .previewItem .remove { background: none; border: none; color: #ff4d4d; cursor: pointer; padding: 0 .2rem; }
  
  #inputRow { display: flex; align-items: flex-end; gap: .5rem; }
  .iconBtn {
    background: none; border: 1px solid var(--border); border-radius: 6px;
    color: var(--accent); font-size: 1.2rem; cursor: pointer;
    width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: all .2s;
  }
  .iconBtn:hover { background: var(--input-bg); }
  .iconBtn.recording {
    color: #ff4d4d; border-color: #ff4d4d; background: rgba(255, 77, 77, 0.1);
    animation: pulse 1s infinite;
  }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0.4); } 50% { box-shadow: 0 0 0 8px rgba(255, 77, 77, 0); } }
  
  #promptInput {
    flex: 1; font-size: .9rem; padding: .6rem; border: 1px solid var(--border);
    border-radius: 6px; background: var(--input-bg); color: var(--text);
    resize: none; min-height: 40px; max-height: 120px; font-family: inherit;
    transition: border-color .2s;
  }
  #promptInput:focus { outline: none; border-color: var(--accent); }
  
  #sendBtn { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: .6rem 1.2rem; cursor: pointer; font-size: .9rem; height: 40px; }
  #sendBtn:disabled { opacity: .5; cursor: not-allowed; }
  
  #controls { display: flex; align-items: center; gap: 1rem; margin-top: .5rem; font-size: .8rem; flex-wrap: wrap; }
  #controls label { display: flex; align-items: center; gap: .3rem; cursor: pointer; }
  
  .help-banner {
    display: none;
    background: rgba(240, 136, 62, 0.1);
    border: 1px solid var(--warning);
    border-radius: 6px;
    padding: .6rem 1rem;
    font-size: .8rem;
    margin-bottom: .5rem;
  }
</style>
</head>
<body data-theme="dark">

<header>
  <h1>🤖 OpenRouter Chat</h1>
  <label for="modelSelect">Model:</label>
  <select id="modelSelect"><option value="">Loading…</option></select>
  <label for="apiKey">Key:</label>
  <input type="password" id="apiKey" placeholder="sk-or-v1-..." style="width:200px">
  <button id="themeToggle">☀️ Light</button>
</header>

<div class="status-bar" id="statusBar">
  <div class="status-dot" id="statusDot"></div>
  <span id="statusText">Initializing...</span>
</div>

<div id="chatContainer"></div>

<div id="inputArea">
  <div id="previewBar"></div>
  <div id="inputRow">
    <button class="iconBtn" id="micBtn" title="Hold to speak, release to stop">🎤</button>
    <button class="iconBtn" id="attachBtn" title="Attach images">📎</button>
    <textarea id="promptInput" placeholder="Type a message... (Enter to send)" rows="1"></textarea>
    <button id="sendBtn">Send</button>
  </div>
  <div id="controls">
    <label><input type="checkbox" id="speakToggle"> 🔊 Speak replies</label>
    <label><input type="checkbox" id="autoSend"> ⚡ Auto-send after voice</label>
    <label><input type="checkbox" id="saveHistory" checked> 💾 Save history</label>
    <button id="clearBtn" style="background:none;border:1px solid var(--border);color:var(--text);padding:.2rem .5rem;cursor:pointer;border-radius:4px;font-size:.8rem;">🗑️ Clear</button>
  </div>
</div>

<input type="file" id="fileInput" multiple accept="image/*" style="display:none">

<script>
// ========== CONFIG ==========
const CONFIG = {
  silenceTimeout: 2000,
  language: 'en-US'
};

// ========== STATE ==========
let messages = [];
let attachedFiles = [];
let isRecording = false;
let silenceTimer = null;
let finalTranscript = '';
let micStream = null;
let recognition = null;

// ========== THEME ==========
document.getElementById('themeToggle').addEventListener('click', () => {
  const light = document.body.dataset.theme === 'light';
  document.body.dataset.theme = light ? 'dark' : 'light';
  document.getElementById('themeToggle').textContent = light ? '☀️ Light' : '🌙 Dark';
});

// ========== LOAD MODELS ==========
(async () => {
  const sel = document.getElementById('modelSelect');
  try {
    const res = await fetch('https://openrouter.ai/api/v1/models');
    const data = await res.json();
    const models = (data.data || []).filter(m => {
      const p = parseFloat(m.pricing?.prompt) || Infinity;
      const c = parseFloat(m.pricing?.completion) || Infinity;
      return (p === 0 && c === 0) ||
        (m.tags || []).some(t => t.toLowerCase().includes('free')) ||
        m.id.toLowerCase().includes('free');
    });
    if (models.length) {
      sel.innerHTML = models.sort((a, b) => a.id.localeCompare(b.id))
        .map(m => `<option value="${m.id}">${m.id}</option>`).join('');
      updateStatus(`✅ ${models.length} models loaded`);
    } else {
      sel.innerHTML = '<option value="">No free models</option>';
    }
  } catch (err) {
    sel.innerHTML = '<option value="">Error</option>';
    updateStatus(`❌ ${err.message}`);
  }
})();

// ========== STATUS ==========
function updateStatus(text, state = 'idle') {
  document.getElementById('statusText').textContent = text;
  const bar = document.getElementById('statusBar');
  const dot = document.getElementById('statusDot');
  bar.className = 'status-bar' + (state === 'recording' ? ' recording' : '');
  dot.className = 'status-dot' + (state === 'idle' ? '' : state === 'recording' ? ' recording' : ' active');
}

// ========== CHAT ==========
function addMessage(role, content) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  if (Array.isArray(content)) {
    div.innerHTML = content.map(p => 
      p.type === 'text' ? escapeHtml(p.text) : `<img src="${p.image_url.url}" style="max-width:200px;border-radius:8px;margin:5px 0;">`
    ).join('');
  } else {
    div.textContent = content;
  }
  document.getElementById('chatContainer').appendChild(div);
  scrollToBottom();
  return div;
}

function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

function scrollToBottom() {
  const c = document.getElementById('chatContainer');
  c.scrollTop = c.scrollHeight;
}

// ========== VOICE INPUT ==========
if (window.SpeechRecognition || window.webkitSpeechRecognition) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const micBtn = document.getElementById('micBtn');
  micBtn.style.display = 'flex';

  async function ensureMicPermission() {
    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      updateStatus('✅ Microphone ready! Click or hold 🎤 to speak', 'active');
      return true;
    } catch (err) {
      updateStatus('❌ Microphone access denied');
      return false;
    }
  }

  ensureMicPermission();

  function startRecording() {
    if (isRecording) return;
    
    finalTranscript = '';
    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = CONFIG.language;

    recognition.onstart = () => {
      isRecording = true;
      micBtn.classList.add('recording');
      updateStatus('🎙️ Listening... Speak now!', 'recording');
    };

    recognition.onresult = (e) => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const text = e.results[i][0].transcript;
        if (e.results[i].isFinal) {
          finalTranscript += text + ' ';
        } else {
          interim += text;
        }
      }
      document.getElementById('promptInput').value = finalTranscript + interim;
    };

    recognition.onend = () => {
      if (isRecording && micStream) {
        try { recognition.start(); } catch(e) { stopRecording(); }
      }
    };

    recognition.onerror = (e) => {
      if (e.error !== 'no-speech' && e.error !== 'aborted') {
        stopRecording();
      }
    };

    try {
      recognition.start();
    } catch (err) {
      isRecording = false;
    }
  }

  function stopRecording() {
    isRecording = false;
    micBtn.classList.remove('recording');
    if (recognition) {
      try { recognition.stop(); } catch(e) {}
      recognition = null;
    }
    const text = finalTranscript.trim() || document.getElementById('promptInput').value.trim();
    document.getElementById('promptInput').value = text;
    updateStatus(`✅ Captured text`, 'active');
    
    if (text && document.getElementById('autoSend').checked) {
      setTimeout(sendMessage, 500);
    }
  }

  // Click toggle
  micBtn.addEventListener('click', () => {
    if (!micStream) {
      ensureMicPermission().then(ok => ok && startRecording());
      return;
    }
    isRecording ? stopRecording() : startRecording();
  });

  // Hold to talk
  micBtn.addEventListener('mousedown', () => { if (micStream) startRecording(); });
  micBtn.addEventListener('mouseup', () => { if (isRecording) setTimeout(stopRecording, 300); });
  micBtn.addEventListener('touchstart', (e) => { e.preventDefault(); if (micStream) startRecording(); });
  micBtn.addEventListener('touchend', () => { if (isRecording) setTimeout(stopRecording, 300); });

} else {
  document.getElementById('micBtn').style.display = 'none';
  updateStatus('❌ Speech not supported. Use Chrome.');
}

// ========== FILE ATTACHMENTS ==========
document.getElementById('attachBtn').addEventListener('click', () => document.getElementById('fileInput').click());

document.getElementById('fileInput').addEventListener('change', async (e) => {
  for (const file of e.target.files) {
    if (!file.type.startsWith('image/')) continue;
    const dataUrl = await new Promise(r => {
      const reader = new FileReader();
      reader.onload = () => r(reader.result);
      reader.readAsDataURL(file);
    });
    attachedFiles.push({ file, dataUrl });
    const item = document.createElement('div');
    item.className = 'previewItem';
    item.innerHTML = `<img src="${dataUrl}"><span>${file.name.substring(0, 15)}</span><button class="remove">✕</button>`;
    item.querySelector('.remove').addEventListener('click', () => {
      const i = attachedFiles.findIndex(f => f.file === file);
      if (i > -1) attachedFiles.splice(i, 1);
      item.remove();
    });
    document.getElementById('previewBar').appendChild(item);
  }
  e.target.value = '';
});

// ========== SEND ==========
const promptInput = document.getElementById('promptInput');

document.getElementById('sendBtn').addEventListener('click', sendMessage);
promptInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

async function sendMessage() {
  const apiKey = document.getElementById('apiKey').value.trim();
  const model = document.getElementById('modelSelect').value;
  const prompt = promptInput.value.trim();
  const speak = document.getElementById('speakToggle').checked;

  if (!apiKey) { alert('Enter API key'); return; }
  if (!model) { alert('Select model'); return; }
  if (!prompt && !attachedFiles.length) { alert('Enter message'); return; }

  if (isRecording) stopRecording();

  addMessage('user', prompt || '[Image]');
  promptInput.value = '';
  promptInput.style.height = 'auto';

  let content;
  if (attachedFiles.length) {
    const imgs = attachedFiles.filter(f => f.file.type.startsWith('image/')).map(f => ({
      type: 'image_url', image_url: { url: f.dataUrl }
    }));
    content = prompt ? [{ type: 'text', text: prompt }, ...imgs] : imgs;
  } else {
    content = prompt;
  }

  messages.push({ role: 'user', content });
  attachedFiles.length = 0;
  document.getElementById('previewBar').innerHTML = '';

  updateStatus('⏳ AI thinking...');
  document.getElementById('sendBtn').disabled = true;

  const thinking = document.createElement('div');
  thinking.className = 'msg assistant';
  thinking.textContent = '...';
  document.getElementById('chatContainer').appendChild(thinking);
  scrollToBottom();

  try {
    const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${apiKey}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ model, messages: messages.map(m => ({ role: m.role, content: m.content })) })
    });

    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const reply = data.choices?.[0]?.message?.content || '[No response]';

    thinking.remove();
    addMessage('assistant', reply);
    messages.push({ role: 'assistant', content: reply });

    if (document.getElementById('saveHistory').checked) {
      localStorage.setItem('or_chat', JSON.stringify(messages));
    }

    updateStatus('✅ Reply received!', 'active');

    if (speak && window.speechSynthesis) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(reply);
      window.speechSynthesis.speak(u);
    }
  } catch (err) {
    thinking.textContent = `❌ ${err.message}`;
    updateStatus('❌ Request failed');
  }

  document.getElementById('sendBtn').disabled = false;
}

// ========== HISTORY ==========
try {
  const saved = JSON.parse(localStorage.getItem('or_chat') || '[]');
  if (saved.length) {
    messages = saved;
    saved.forEach(m => addMessage(m.role, m.content));
    updateStatus(`✅ Loaded ${saved.length} messages`);
  }
} catch (e) { messages = []; }

document.getElementById('clearBtn').addEventListener('click', () => {
  if (confirm('Clear chat?')) {
    messages = [];
    document.getElementById('chatContainer').innerHTML = '';
    localStorage.removeItem('or_chat');
    updateStatus('🗑️ Cleared');
  }
});

// ========== AUTO RESIZE ==========
promptInput.addEventListener('input', () => {
  promptInput.style.height = 'auto';
  promptInput.style.height = Math.min(promptInput.scrollHeight, 120) + 'px';
});
</script>

</body>
</html>
